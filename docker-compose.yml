services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docketiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docketiq}
      POSTGRES_DB: ${POSTGRES_DB:-docketiq}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docketiq}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
